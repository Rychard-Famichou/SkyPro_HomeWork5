[project]
name = "djangohomework2"
version = "0.1.0"
description = "Платформа для онлайн-обучения"
authors = [
    {name = "Rychard Famichou",email = "rychard.famichou@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "stripe (>=15.2.1,<16.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.41.0,<0.42.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "redis (>=8.0.1,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "gunicorn (>=26.0.0,<27.0.0)",
    "django-redis (>=7.0.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.14.2,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.2.0,<3.0.0)"
]

[tool.poetry]
package-mode = false

[tool.black]
line-length = 119
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | venv
  | dist
  | migrations  # Исключаем миграции Django, так как автогенерация может нарушать стиль
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
# Специфичные группы для вашего стека
known_django = ["django", "rest_framework", "corsheaders"]
known_celery = ["celery", "kombu"]
sections = ["FUTURE", "STDLIB", "DJANGO", "CELERY", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations"]

[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main"
]
strict = true # Включает строгую проверку типов (по желанию)
ignore_missing_imports = true # Игнорировать библиотеки без аннотаций типов

# Настройки для плагина django-stubs
[tool.django-stubs]
django_settings_module = "config.settings"

# Исключения для автогенерируемого кода
[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

