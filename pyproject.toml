[project]
name = "djangohomework2"
version = "0.1.0"
description = "Платформа для онлайн-обучения"
authors = [
    {name = "Rychard Famichou",email = "rychard.famichou@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=6.0.6,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "djangorestframework-stubs (>=3.17.0,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "stripe (>=15.2.1,<16.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "eventlet (>=0.41.0,<0.42.0)",
    "celery-types (>=0.26.0,<0.27.0)",
    "redis (>=8.0.1,<9.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.14.2,<8.0.0)"
]

[tool.poetry]
package-mode = false